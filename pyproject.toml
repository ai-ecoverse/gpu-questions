[project]
name = "gpu-questions"
version = "0.1.0"
description = "Tiny token tagger that turns agent questions into structured answer options"
requires-python = ">=3.14,<3.15"
dependencies = ["torch", "numpy"]

[dependency-groups]
dev = ["pytest"]
teacher = [
    "transformers>=5.17.0",
]
export = [
    "onnx>=1.16",
    "onnxruntime>=1.19",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
